# CI do Sentinela — especificação em planejamento_testes.md
#
# Tudo que vem DEPOIS de "o cliente já está na br0" é testado aqui, num Linux
# real. Wi-Fi, celular, VM Windows e RDP ficam no roteiro manual do Mint.
#
# Runner fixado em ubuntu-24.04: mesma base do Linux Mint 22 (kernel, nftables,
# MySQL, Python 3.12), para o CI se comportar como o host de verdade.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_ADMIN_USER: root
  MYSQL_ADMIN_PASSWORD: root
  MYSQL_USER: sentinela          # o código nunca usa root
  MYSQL_PASSWORD: sentinela-ci
  MYSQL_DATABASE: vigia_de_rede
  PORTAL_SENHA: senha-ci

jobs:
  unidade:
    name: "Job 0 · Unidade + lint dos scripts"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
      - name: shellcheck
        run: shellcheck -S warning $(git ls-files '*.sh')
      - run: .venv/bin/python -m pytest -v -m unidade

  banco:
    name: "Job 1 · Banco (schema + queries)"
    runs-on: ubuntu-24.04
    services:
      mysql: &mysql
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        # -h 127.0.0.1 força TCP: só fica saudável depois da inicialização real
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: .venv/bin/python -m pytest -v -m banco

  firewall:
    name: "Job 2 · Firewall / whitelist (nftables)"
    runs-on: ubuntu-24.04
    services:
      mysql: *mysql
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
        with:
          pacotes: nftables
      - run: .venv/bin/python -m pytest -v -m firewall

  rede:
    name: "Job 3 · Rede simulada + Sentinela"
    runs-on: ubuntu-24.04
    services:
      mysql: *mysql
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
        with:
          pacotes: nmap arp-scan
      # namespaces, bridge e arp-scan precisam de root; -E mantém as MYSQL_*
      - run: sudo -E .venv/bin/python -m pytest -v -m rede -p no:cacheprovider

  portal:
    name: "Job 4 · Portal cativo (Flask)"
    runs-on: ubuntu-24.04
    services:
      mysql: *mysql
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: .venv/bin/python -m pytest -v -m portal
