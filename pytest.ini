[pytest]
testpaths = tests
# '.' expõe o pacote sentinela/; 'captive' mantém os imports planos do portal
# (from firewall_ctl import ...), iguais aos de quando ele roda no host.
pythonpath = . captive
addopts = -ra --strict-markers
markers =
    banco: Job 1 — schema e queries no MySQL
    firewall: Job 2 — conjunto nftables e ressync (precisa de sudo nft)
    rede: Job 3 — rede simulada com namespaces + agente (precisa de root)
    portal: Job 4 — rotas Flask do portal cativo
