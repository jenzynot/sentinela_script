[pytest]
testpaths = tests
# '.' expõe os pacotes sentinela/ e provision/; 'captive' e 'network' mantêm
# os imports planos dos scripts (from firewall_ctl import ...), iguais aos de
# quando eles rodam no host.
pythonpath = . captive network
addopts = -ra --strict-markers
markers =
    unidade: Job 0 — lógica pura, sem infraestrutura (configs, parsers, provisionamento)
    banco: Job 1 — schema e queries no MySQL
    firewall: Job 2 — conjunto nftables e ressync (precisa de sudo nft)
    rede: Job 3 — rede simulada com namespaces + agente (precisa de root)
    portal: Job 4 — rotas Flask do portal cativo
